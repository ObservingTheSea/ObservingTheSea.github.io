name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch content data (passages / stories / prebuilt data)
        run: |
          curl -L --retry 3 -o /tmp/data-source.zip "https://github.com/wuwangzhang1216/ChinaTextbookStudyFree/releases/download/v1.1.0-assets/data-source.zip"
          curl -L --retry 3 -o /tmp/data.zip "https://github.com/wuwangzhang1216/ChinaTextbookStudyFree/releases/download/v1.1.0-assets/data.zip"
          python3 - <<'PY'
          import zipfile
          jobs = [("/tmp/data-source.zip", "data"), ("/tmp/data.zip", "apps/web/public/data")]
          for src, dst in jobs:
              with zipfile.ZipFile(src) as z:
                  for info in z.infolist():
                      info.filename = info.filename.replace("\\", "/")
                      z.extract(info, dst)
              print("extracted:", src, "->", dst)
          PY

      - name: Install dependencies
        run: npm install

      - name: Build static site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
